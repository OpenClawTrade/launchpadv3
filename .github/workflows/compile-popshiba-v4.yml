name: Compile PopShiba V4 contracts

on:
  push:
    paths:
      - 'contracts/popshiba/v4/**.sol'
      - 'foundry.toml'
      - '.github/workflows/compile-popshiba-v4.yml'
  workflow_dispatch:

permissions:
  contents: write   # allow committing built artifacts back to the repo

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Solidity dependencies
        run: |
          mkdir -p lib
          git clone --depth=1 https://github.com/Uniswap/v4-core lib/v4-core
          git clone --depth=1 https://github.com/Uniswap/v4-periphery lib/v4-periphery
          git clone --depth=1 -b master https://github.com/OpenZeppelin/uniswap-hooks lib/uniswap-hooks
          git clone --depth=1 -b master https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth=1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth=1 https://github.com/transmissions11/solmate lib/solmate

      - name: Compile contracts (viaIR + optimizer)
        run: forge build --use 0.8.26 --names --sizes

      - name: Extract artifacts (ABI + bytecode) into edge function dir
        run: |
          mkdir -p supabase/functions/popv4-deploy-factory/artifacts
          for name in PopBondingToken PopCurveImpl PopV4LpLocker PopBondingHookV4 PopBondingFactoryV4; do
            jq '{abi: .abi, bytecode: .bytecode.object}' "out/${name}.sol/${name}.json" \
              > "supabase/functions/popv4-deploy-factory/artifacts/${name}.json"
            echo "  ✓ ${name}.json ($(wc -c < supabase/functions/popv4-deploy-factory/artifacts/${name}.json) bytes)"
          done

      - name: Commit artifacts back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/popv4-deploy-factory/artifacts/
          if git diff --staged --quiet; then
            echo "No artifact changes — skipping commit."
          else
            git commit -m "chore(v4): rebuild compiled artifacts [skip ci]"
            git push
          fi
