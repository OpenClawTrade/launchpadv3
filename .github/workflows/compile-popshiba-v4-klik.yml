name: Compile PopShiba V4-Klik

on:
  push:
    paths:
      - 'contracts/popshiba/v4-klik/**'
      - '.github/workflows/compile-popshiba-v4-klik.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Init forge libs (if missing)
        run: |
          [ -d lib/forge-std ] || forge install foundry-rs/forge-std --no-commit
          [ -d lib/v4-core ]  || forge install Uniswap/v4-core --no-commit
          [ -d lib/uniswap-hooks ] || forge install OpenZeppelin/uniswap-hooks --no-commit
          [ -d lib/openzeppelin-contracts ] || forge install OpenZeppelin/openzeppelin-contracts --no-commit
          [ -d lib/solmate ] || forge install transmissions11/solmate --no-commit

      - name: Build v4-klik
        run: |
          forge build \
            --root . \
            --contracts contracts/popshiba/v4-klik \
            --out out-v4-klik \
            --via-ir \
            --optimize --optimizer-runs 200 \
            --use 0.8.26 \
            --evm-version cancun

      - name: Extract artifacts (Foundry JSON -> TS modules)
        run: |
          mkdir -p supabase/functions/popv4klik-deploy/artifacts
          for c in PopKlikToken PopKlikHook PopKlikFactory; do
            jq '{abi, bytecode: .bytecode.object, deployedBytecode: .deployedBytecode.object}' \
              "out-v4-klik/${c}.sol/${c}.json" \
              > "supabase/functions/popv4klik-deploy/artifacts/${c}.json"
            # Wrap as TS so Deno bundler picks it up
            echo "export default $(cat supabase/functions/popv4klik-deploy/artifacts/${c}.json) as const;" \
              > "supabase/functions/popv4klik-deploy/artifacts/${c}.ts"
          done

      - name: Commit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/popv4klik-deploy/artifacts/
          git diff --staged --quiet || git commit -m "ci: rebuild v4-klik artifacts"
          git push || true
