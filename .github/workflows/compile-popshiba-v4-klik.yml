name: Compile PopShiba V4-Klik (bytecode-parity)

on:
  push:
    paths:
      - 'contracts/popshiba/v4-klik/**'
      - 'foundry.toml'
      - '.github/workflows/compile-popshiba-v4-klik.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # ── Factory + Token: solc 0.8.30, default evm, no via-IR ────────────────
      - name: Build Klik factory (PopKlikFactory + PopKlikToken)
        env:
          FOUNDRY_PROFILE: klik-factory
        run: |
          forge build \
            --root . \
            --use 0.8.30 \
            --optimize --optimizer-runs 200 \
            --no-cache

      # ── Hook: solc 0.8.26, cancun, via-IR ──────────────────────────────────
      - name: Build Klik hook (PopKlikHook)
        env:
          FOUNDRY_PROFILE: klik-hook
        run: |
          forge build \
            --root . \
            --use 0.8.26 \
            --evm-version cancun \
            --via-ir \
            --optimize --optimizer-runs 200 \
            --no-cache

      - name: Extract artifacts (Foundry JSON → TS modules)
        run: |
          mkdir -p supabase/functions/popv4instant-deploy/artifacts

          # PopKlikFactory + PopKlikToken come out of the factory profile.
          # Filename = ContractName.json under the source-file dir.
          for c in PopKlikFactory PopKlikToken; do
            jq '{abi, bytecode: .bytecode.object, deployedBytecode: .deployedBytecode.object}' \
              "out-klik-factory/Factory_whook.sol/${c}.json" \
              > "supabase/functions/popv4instant-deploy/artifacts/${c}.json"
            echo "export default $(cat supabase/functions/popv4instant-deploy/artifacts/${c}.json) as const;" \
              > "supabase/functions/popv4instant-deploy/artifacts/${c}.ts"
          done

          # PopKlikHook comes out of the hook profile.
          jq '{abi, bytecode: .bytecode.object, deployedBytecode: .deployedBytecode.object}' \
            "out-klik-hook/TaxHook.sol/PopKlikHook.json" \
            > "supabase/functions/popv4instant-deploy/artifacts/PopKlikHook.json"
          echo "export default $(cat supabase/functions/popv4instant-deploy/artifacts/PopKlikHook.json) as const;" \
            > "supabase/functions/popv4instant-deploy/artifacts/PopKlikHook.ts"

      - name: Bytecode-parity diff vs Klik mainnet
        run: |
          # Strip metadata trailing CBOR (~53 bytes for ipfs hash) for a fair
          # runtime-bytecode comparison. Result is informational only — does
          # not fail the build.
          echo "=== Factory deployedBytecode length ==="
          jq -r '.deployedBytecode | length' supabase/functions/popv4instant-deploy/artifacts/PopKlikFactory.json
          echo "=== Hook deployedBytecode length ==="
          jq -r '.deployedBytecode | length' supabase/functions/popv4instant-deploy/artifacts/PopKlikHook.json

      - name: Commit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/popv4instant-deploy/artifacts/
          git diff --staged --quiet || git commit -m "ci: rebuild Klik-parity artifacts"
          git push || true
